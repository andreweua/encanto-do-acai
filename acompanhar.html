<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido | Encanto do Açaí</title>
    <meta name="theme-color" content="#380B4E">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        acai: { dark: '#380B4E', magenta: '#E3005A', yellow: '#FFC107', cyan: '#00BFA5' },
                        gold: { 400: '#e5c07b' },
                    },
                    fontFamily: {
                        display: ['"Lilita One"', 'cursive'],
                        script: ['"Pacifico"', 'cursive'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-acai-dark text-white border-b border-acai-magenta/40 shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <a href="./index.html" class="font-display text-xl sm:text-2xl tracking-wide">
                ENCANTO <span class="font-script text-acai-yellow font-normal lowercase">do Açaí</span>
            </a>
            <a href="./index.html" class="inline-flex items-center gap-2 text-xs sm:text-sm font-bold bg-acai-yellow text-acai-dark px-4 py-2 rounded-full hover:bg-yellow-400 transition-colors">
                <i class="fa-solid fa-ice-cream"></i> Fazer Novo Pedido
            </a>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6 flex-1">
        <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-md border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                    <h1 class="font-display text-2xl sm:text-3xl text-acai-dark">ACOMPANHAR PEDIDO E FILA</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Veja em tempo real quando seu açaí entra em preparo e fica pronto.</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="fila-status-sync" class="text-xs text-slate-500 font-medium">Atualizando...</span>
                    <button id="btn-atualizar-fila" type="button" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full cursor-pointer">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Atualizar
                    </button>
                </div>
            </div>

            <form id="form-buscar-pedido" class="flex flex-col sm:flex-row gap-2.5">
                <input
                    id="input-numero-pedido"
                    type="text"
                    placeholder="Número do pedido (ex.: 12112026-001)"
                    class="flex-1 rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-acai-magenta"
                >
                <button type="submit" class="bg-acai-magenta hover:bg-pink-600 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">
                    Consultar Pedido
                </button>
            </form>
        </section>

        <section id="resultado-meu-pedido"></section>

        <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-md border border-slate-200 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="font-display text-xl text-acai-dark">FILA DE PEDIDOS AO VIVO</h2>
                <span class="text-xs text-slate-400">Atualiza a cada 15s</span>
            </div>
            <div id="lista-fila-ao-vivo" class="space-y-2.5"></div>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-5 px-4 mt-8">
        <p class="text-[10px] text-slate-500 text-center">
            Desenvolvido por:
            <a href="https://github.com/andreweua" target="_blank" rel="noopener noreferrer" class="hover:text-gold-400 text-slate-400 transition font-medium">PereiraLabs - Divisão de Tecnologia e IA</a> |
            <span class="text-slate-400 font-medium">Louzada &amp; Pereira - Soluções Digitais</span>.
            <a href="./CHANGELOG.md" target="_blank" class="hover:text-gold-400 font-mono text-[10px] text-slate-500 hover:underline ml-1">v1.5.0</a>
        </p>
    </footer>

    <script src="./js/config.js?v=1.5.0"></script>
    <script src="./js/acompanhar.js?v=1.5.0"></script>
</body>
</html>
